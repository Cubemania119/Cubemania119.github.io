<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Location-Based AR</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">
    <a-scene
        vr-mode-ui="enabled: false"
        embedded
        arjs="sourceType: webcam; debugUIEnabled: false;">
        <a-text
            value="Target Located!"
            look-at="[gps-camera]"
            scale="15 15 15"
            gps-entity-place="latitude: 32.309557; longitude: -90.858122;">
        </a-text>
        <a-box
            color="red"
            depth="2"
            height="2"
            width="2"
            look-at="[gps-camera]"
            gps-entity-place="latitude: 32.350938; longitude: -90.883813;">
        </a-box>
        <a-box
            color="blue"
            depth="2"
            height="2"
            width="2"
            look-at="[gps-camera]"
            gps-entity-place="latitude: 32.3528204; longitude: -90.8826774;">
        </a-box>
        <a-box
            color="yellow"
            depth="2"
            height="2"
            width="2"
            look-at="[gps-camera]"
            gps-entity-place="latitude: 32.351563; longitude: -90.881812;">
        </a-box>
        <a-box
            color="green"
            depth="2"
            height="2"
            width="2"
            look-at="[gps-camera]"
            gps-entity-place="latitude: 32.3643288; longitude: -90.8599028;">
        </a-box>
        <a-box
            color="red"
            depth="2"
            height="2"
            width="2"
            look-at="[gps-camera]"
            gps-entity-place="latitude: 32.329495833628684; longitude: -90.87841851486634;">
        </a-box>
        <a-camera gps-camera="maxDistance: 100" rotation-reader></a-camera>
    </a-scene>
</body>
</html>
